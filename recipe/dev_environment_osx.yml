name: idvc_dev
channels:
  - conda-forge
  - ccpi
dependencies:
    # - eqt >=1.0.1
    - openpyxl
    - python ==3.11
    - numpy
    - pandas
    - pyside6
    - scipy
    # - ccpi::ccpi-viewer >=25.0.0
    - ccpi/label/dev::ccpi-dvc >=25.0.0
    - natsort
    - docopt
    - matplotlib-base
    - llvm-openmp                
    - qdarkstyle
    - h5py
    - pyyaml
    - schema
    - qtpy
    - filetype
    - pip:
      - --extra-index-url https://wheels.vtk.org
      - vtk
      - git+https://github.com/TomographicImaging/CILViewer.git#subdirectory=Wrappers/Python
      - eqt >=1.0.1
